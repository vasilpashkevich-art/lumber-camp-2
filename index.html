<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0b08">
</head><body>
<title>Лагерь лесоруба II</title>
<style>
:root{--bg:#0e0b08;--panel:rgba(18,12,8,.88);--line:#8a6a3a;--gold:#e7c35a;--txt:#e9dfc8;--dim:#a89878;--hi:#ffe9a8;--red:#c8323a;--grn:#5fd35f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#game,#selCanvas{position:fixed;inset:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(#4a3420,#24180f);border:2px solid var(--gold);border-radius:8px;color:var(--hi);font-weight:bold;padding:10px 18px;min-height:44px}
.btn:hover{filter:brightness(1.2)} .btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.main{background:linear-gradient(#a8281e,#5e120c);font-size:20px}
.btn.danger{background:linear-gradient(#7a1a14,#3e0a08)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
h2{margin:0 0 10px;color:var(--hi);font-size:26px} h3{margin:6px 0 8px;color:var(--hi);font-size:17px}
/* ---------- экран выбора героя ---------- */
#select h1{position:fixed;top:3vh;left:0;right:0;text-align:center;margin:0;font-size:clamp(30px,4.4vw,52px);background:linear-gradient(#f5d77a,#a87a2a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.pan{background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 4px rgba(244,199,102,.12)}
#selInfo{position:fixed;left:3.5vw;top:15vh;width:min(400px,40vw);padding:22px 26px}
#selInfo .cls{margin:-4px 0 14px;font-size:18px}
dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0} dt{color:var(--dim)} dd{margin:0;text-align:right}
#selRight{position:fixed;right:3.5vw;top:12vh;bottom:calc(4vh + 70px);width:min(340px,38vw);display:flex;flex-direction:column;gap:8px}
#selList{flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;padding-right:2px} #selList>.slot{flex:none}
#selRight>.btn,#selRight>.row,#selRight>.t{flex:none}
#selRight .t{text-align:center;color:var(--txt);font-size:20px;margin-bottom:2px}
.slot{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto auto;column-gap:12px;align-items:center;text-align:left;background:var(--panel);border:2px solid #5a4630;border-radius:10px;padding:8px 12px;min-height:80px}
.slot canvas{grid-row:1/4;width:58px;height:58px;border-radius:50%}
.slot b{font-size:19px;color:var(--hi)} .slot i{font-style:normal;font-size:14px} .slot small{color:var(--dim);font-size:13px}
.slot.on{border-color:#f5d77a;box-shadow:0 0 0 1px #f5d77a, 0 0 18px rgba(245,215,122,.25)}
.slot.empty{display:flex;justify-content:center;color:#7a6a4e;border-style:dashed}
#selRight .row{justify-content:stretch;margin-top:6px} #selRight .row .btn{flex:1}
#selBottom{position:fixed;left:0;right:0;bottom:4vh;display:flex;justify-content:center;pointer-events:none}
#selBottom .btn{pointer-events:auto;min-width:260px}
#selFiles{position:fixed;left:3.5vw;bottom:4vh;display:flex;gap:10px}
#ver{position:fixed;right:10px;bottom:6px;color:#6a5a40;font-size:12px}
/* ---------- окна ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.box{background:linear-gradient(#2a2016,#16100b);border:2px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 4px rgba(244,199,102,.1);padding:22px 26px;max-width:min(520px,96vw);max-height:94vh;overflow:auto}
.box.wide{max-width:min(920px,96vw)}
.box p{line-height:1.45} .box .hint{color:var(--dim);font-size:13px} .box .err{color:#ff8a7a}
.box textarea{width:100%;background:#120c08;color:var(--txt);border:1px solid #5a4630;border-radius:6px;padding:8px;font:12px monospace;user-select:text}
.box input[type=file]{margin:6px 0 10px;color:var(--dim)}
.classes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.clsCard{width:180px;background:#1a120c;border:2px solid #5a4630;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.clsCard canvas{width:150px;height:166px} .clsCard b{font-size:20px} .clsCard small{color:var(--dim);font-size:13px;text-align:center}
.clsCard.on{border-color:#f5d77a;box-shadow:0 0 16px rgba(245,215,122,.3)}
.nm{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:18px;color:var(--hi)}
.nm input{flex:1;font:18px Georgia,serif;background:#120c08;color:var(--hi);border:2px solid #5a4630;border-radius:8px;padding:8px 10px;user-select:text}
.dice{background:none;border:none;font-size:24px}
@media (max-height:820px){ .slot{min-height:64px;padding:5px 10px} .slot canvas{width:50px;height:50px} #selRight{top:10vh} #select h1{top:1.5vh;font-size:clamp(26px,3.6vw,42px)} }
/* ---------- интерфейс игры ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#portrait{position:fixed;left:12px;top:12px;display:flex;gap:10px;align-items:center}
#pfRing{position:relative;width:76px;height:76px;border-radius:50%;border:3px solid #c43a2c;background:radial-gradient(#3a2d1c,#120c08);overflow:hidden;box-shadow:0 0 0 2px #24180f}
#pfCanvas{width:76px;height:76px}
#pfLvl{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:#1a1410;border:2px solid var(--gold);border-radius:10px;padding:0 7px;font-weight:bold;color:var(--hi);font-size:14px}
.bars{display:flex;flex-direction:column;gap:5px;width:280px}
.bars b{color:var(--hi);font-size:16px;text-shadow:0 1px 2px #000}
.bar{position:relative;height:20px;background:#1a1410;border:1.5px solid #000;border-radius:4px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5fd35f,#2a8a2a);transition:width .15s}
.bar>span{position:relative;display:block;text-align:center;font-size:13px;line-height:18px;white-space:nowrap;color:#fff;text-shadow:0 1px 2px #000}
#pfXp{height:15px} #pfXp>i{background:linear-gradient(#c8a0ff,#7a4ad8)} #pfXp>span{font-size:11px;line-height:13px}
.status{font-size:12px;color:#c8c8ff} #pfPoison{color:#8ad84a} #pfFist{color:#ffb347}
#target{position:fixed;left:330px;top:18px;width:220px;display:flex;flex-direction:column;gap:4px}
#target .top{display:flex;gap:8px;align-items:baseline} #tgLvl{font-weight:bold} #tgName{color:var(--hi);text-shadow:0 1px 2px #000}
#tgHp>i{background:linear-gradient(#e2453a,#8a1a14)} #tgNote{font-size:12px;color:var(--dim)}
#topRight{position:fixed;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:200px;height:125px;border:2px solid var(--line);border-radius:8px;background:#1c2a1a}
#zoneName{color:var(--hi);font-size:15px;text-shadow:0 1px 3px #000}
#goldBox{font-weight:bold;text-shadow:0 1px 3px #000;background:var(--panel);border:1px solid #4a3a2a;border-radius:8px;padding:2px 8px}
#mini{cursor:pointer}
.money{display:inline-flex;align-items:center;gap:3px;white-space:nowrap} .money b{color:var(--txt);font-weight:bold}
.coin{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;border:1px solid rgba(0,0,0,.6);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 1px 1px 0 rgba(255,255,255,.5)}
.cg{background:#f2c037} .cs{background:#cfd6dc} .cc{background:#c4703a}
/* подсумок */
.box.loot{width:300px;padding:16px 18px}
.loot h2{font-size:20px;margin-bottom:8px} .loot .lv{color:var(--dim);font-size:13px;font-weight:normal}
.lrow{display:flex;align-items:center;gap:10px;width:100%;background:#1a120c;border:1.5px solid #4a3a2a;border-radius:8px;padding:6px 8px;margin:5px 0;text-align:left}
.lrow:hover{border-color:var(--gold)} .lrow .nm2{flex:1;font-size:15px} .lrow .cic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:22px}
.loot .row{justify-content:space-between;flex-wrap:nowrap} .loot .row .btn{padding:8px 12px;font-size:16px;min-height:40px} .loot .row .btn small{font-size:12px;opacity:.8}
.modal.light{background:transparent;justify-content:flex-start;align-items:flex-start;padding:22vh 0 0 calc(50vw - 420px);pointer-events:none} .modal.light .box{pointer-events:auto}
@media (max-width:900px){.modal.light{padding:16vh 0 0 12px}}
/* большая карта */
.box.map{max-width:min(1180px,98vw);padding:14px 16px}
.map canvas{width:auto;height:auto;max-width:100%;max-height:calc(94vh - 150px);margin:0 auto;border-radius:8px;border:1px solid #4a3a2a;display:block}
.map .row{margin-top:8px}
.map .hint{margin:6px 0 0}
#actbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px}
.act{position:relative;width:58px;height:58px;border:2px solid #5a4630;border-radius:8px;background:#1a120c;padding:0;overflow:hidden}
.act .ico{position:absolute;inset:6px} .act .ico svg{width:100%;height:100%}
.act .k{position:absolute;right:3px;top:1px;font-size:11px;color:var(--hi);text-shadow:0 1px 2px #000}
.act .n{position:absolute;right:4px;bottom:2px;font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000}
.act .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.6)}
.act .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;color:#fff;text-shadow:0 1px 3px #000}
.act.on{border-color:var(--gold)} .act.tr{border-color:#4a9eff;box-shadow:0 0 8px rgba(74,158,255,.35)}
.act .lock{position:absolute;inset:0;background:rgba(10,6,4,.72);display:flex;flex-direction:column;align-items:center;justify-content:center} .act .lock svg{width:24px;height:24px} .act .lock b{font-size:11px;color:var(--hi);line-height:1}
.act.ready{animation:glowA 1.2s ease-in-out 4} @keyframes glowA{50%{box-shadow:0 0 14px 4px #ffd34d;border-color:#ffd34d}}
#pfRing{cursor:pointer}
/* окно умений */
.box.abils{width:520px} .abl{display:flex;gap:14px;align-items:flex-start;background:#1a120c;border:1.5px solid #4a3a2a;border-radius:10px;padding:10px 12px;margin:8px 0}
.abl .ic{position:relative;width:58px;height:58px;flex:none;border:2px solid #5a4630;border-radius:8px;background:#120c08;padding:6px} .abl .ic svg{width:100%;height:100%}
.abl b{font-size:18px;color:var(--hi)} .abl .kk{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--gold);border-radius:4px;font-size:12px;color:var(--hi)} .abl p{margin:4px 0 0;color:var(--txt);font-size:14px} .abl small{color:var(--dim)}
.abl.locked{opacity:.75} .abl.locked .ic::after{content:'';position:absolute;inset:0;background:rgba(10,6,4,.6);border-radius:6px} .abl .lv{color:#ffb347;font-weight:bold}
/* перетаскивание в сумке */
.cell.drag{opacity:.35} .cell.over{border-color:var(--gold);box-shadow:0 0 0 2px rgba(231,195,90,.5) inset}
.sq{width:46px;height:46px;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:6px}
#sideBtns{position:fixed;right:12px;bottom:12px;display:flex;gap:8px}
#zoneTitle{position:fixed;left:50%;top:21vh;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:59;opacity:0}
#zoneTitle b{display:block;font-size:38px;color:#ffe9a8;text-shadow:0 2px 6px #000,0 0 2px #000;letter-spacing:.5px}
#zoneTitle small{display:block;font-size:17px;color:#e8dcc0;text-shadow:0 1px 4px #000}
#zoneTitle.show{animation:zt 4.2s ease forwards}
@keyframes zt{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60}
.toast{background:rgba(18,12,8,.9);border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:var(--txt);transition:opacity .4s;max-width:80vw;text-align:center}
.toast.good{border-color:#5fd35f;color:#d8ffd0} .toast.out{opacity:0}
.tip{position:fixed;z-index:80;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.tip .tcard{width:236px;background:rgba(14,10,6,.96);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tip.two .tcard+.tcard{opacity:.92;border-style:dashed}
.tip .prop{color:#7fe07f} .tip .tdiff{margin-top:6px;border-top:1px solid #4a3a2a;padding-top:5px} .tip .tdiff i{color:var(--dim);font-size:12px;display:block;margin-bottom:2px}
.tip .up{color:#6fe06f} .tip .down{color:#ff7a6a} .tip .sum{font-weight:bold}
.cell{position:relative} .upmark,.cic .upmark{position:absolute;right:2px;top:0;color:#5fe05f;font-size:14px;text-shadow:0 0 3px #000,0 0 2px #000;pointer-events:none} .cic{position:relative}
.tip .hint2{color:#a8d8a0;font-size:12px;margin:0 0 4px} .tip b{display:block;font-size:16px} .tip small{color:var(--dim)} .tip p{margin:3px 0;font-size:14px} .tip .gold{color:#ffd34d} .tip .bad{color:#ff8a7a} .tip hr{border:none;border-top:1px solid #4a3a2a}
.charwin{display:flex;gap:22px;flex-wrap:wrap} .bagside{flex:1 1 460px;max-width:470px}
.dollw{display:grid;grid-template-columns:52px 170px 52px;gap:8px;align-items:start}
.dollw canvas{width:170px;height:236px;background:radial-gradient(#3a2d1c,#120c08 70%);border-radius:10px;border:1px solid #4a3a2a}
.eq{display:grid;grid-template-columns:52px;gap:8px}
.skillb{max-width:290px;margin-top:8px} .skrow{display:flex;justify-content:space-between;color:var(--dim);font-size:13px} .skbar{height:9px;background:#120c08;border:1px solid #4a3a2a;border-radius:5px;overflow:hidden} .skbar i{display:block;height:100%;background:linear-gradient(#e0a060,#a85a28)}
.ware2{display:flex;align-items:center;gap:12px;background:#1a120c;border:1.5px solid #4a3a2a;border-radius:8px;padding:8px 10px;margin-bottom:8px} .ware2>div{flex:1} .ware2 b{display:block} .ware2 small{color:var(--dim)} .ware2 .btn{padding:6px 12px;min-height:38px;font-size:15px} .ware2 .btn[disabled]{opacity:.45}
table.ores{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px} table.ores th{color:var(--dim);text-align:left;font-weight:normal} table.ores td,table.ores th{padding:3px 6px;border-bottom:1px solid #3a2a1a}
.tip .cnt{color:var(--dim);font-size:13px}
.jh{margin:12px 0 6px;color:var(--hi);font-size:16px} .jh small{color:var(--dim);font-weight:normal;font-size:12px} .ware .ic{position:relative} .ware .pr.no{opacity:.5}
.cell{width:52px;height:52px;border:1.5px solid #4a3a2a;border-radius:8px;background:#120c08;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.cell .empty{font-size:10px;color:#6a5a40;text-align:center}
.cell .pr{position:absolute;right:2px;bottom:0;font-size:11px;color:#ffd34d;font-weight:bold;text-shadow:0 1px 2px #000}
.stats{font-size:14px;max-width:290px}
.bag{display:grid;grid-template-columns:repeat(8,52px);gap:6px}
.cell .n{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none}
.vend{display:flex;gap:26px;flex-wrap:wrap}
.ware{display:flex;gap:10px;align-items:center;width:300px;text-align:left;background:#1a120c;border:1.5px solid #5a4630;border-radius:8px;padding:8px}
.ware small{display:block;color:var(--dim);font-size:12px} .ware .pr{margin-left:auto;color:#ffd34d;font-weight:bold;font-size:18px}
.who{color:var(--dim);font-style:italic} .box .gold{color:#ffd34d}
.box.death{text-align:center} .box.death h2{color:#ff6a5a;font-size:32px}
.tgl{display:flex;gap:8px;align-items:center;font-size:17px;margin:6px 0 12px}
.vol{display:grid;grid-template-columns:120px 1fr;align-items:center;margin:6px 0}
.keys p{font-size:14px;color:var(--dim);line-height:1.6} .keys b{color:var(--hi)}
#touch{display:none}
@media (pointer:coarse){
  #touch{display:block} #actbar{right:10px;left:auto;transform:none;bottom:10px;display:grid;grid-template-columns:repeat(2,62px);gap:8px;padding:8px;background:rgba(18,12,8,.55)}
  .act{width:62px;height:62px} .act .k{display:none} #sideBtns{top:150px;bottom:auto}
  #target{left:12px;top:100px}
}
@media (max-width:760px){ .bars{width:150px} #target{left:12px;top:100px} #mini{width:140px;height:88px} #selInfo{display:none} #selRight{left:4vw;right:4vw;width:auto;top:11vh;bottom:calc(12vh + 60px)} .slot{min-height:64px} #selFiles{bottom:12vh} }
</style>

<canvas id="game" hidden></canvas>

<div id="select" hidden>
  <canvas id="selCanvas"></canvas>
  <h1>Лагерь лесоруба II</h1>
  <div id="selInfo" class="pan"></div>
  <div id="selRight">
    <div class="t">Твои герои</div>
    <div id="selList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn" id="selNew">Создать героя</button>
    <div class="row"><button class="btn" id="selDel">Удалить</button><button class="btn" id="selSet">Настройки</button></div>
  </div>
  <div id="selFiles"><button class="btn" id="selSave">В файл</button><button class="btn" id="selLoad">Из файла</button></div>
  <div id="selBottom"><button class="btn main" id="selEnter">Войти в мир</button></div>
  <div id="ver"></div>
</div>

<div id="hud" hidden>
  <div id="portrait">
    <div id="pfRing"><canvas id="pfCanvas" width="160" height="160"></canvas><div id="pfLvl">1</div></div>
    <div class="bars"><b id="pfName"></b><div class="bar" id="pfHp"><i></i><span></span></div><div class="bar" id="pfXp"><i></i><span></span></div>
      <span class="status" id="pfWeak" hidden></span><span class="status" id="pfPoison" hidden>отравлен</span><span class="status" id="pfFist" hidden>Без оружия — бьёт кулаками</span></div>
  </div>
  <div id="target" hidden><div class="top"><span id="tgLvl"></span><span id="tgName"></span></div><div class="bar" id="tgHp"><i></i><span></span></div><span id="tgNote"></span></div>
  <div id="topRight"><canvas id="mini" width="400" height="250" title="Карта — K"></canvas><div id="zoneName"></div><div id="goldBox" title="Деньги: 100 меди = 1 серебро, 100 серебра = 1 золото"><span id="gold"></span></div></div>
  <div id="actbar">
    <button class="act" id="actAttack"><span class="ico"></span><span class="k">Пробел</span><span class="cd"></span><span class="cdt"></span></button>
    <button class="act" id="actAbil"><span class="ico"></span><span class="k">C</span><span class="cd"></span><span class="cdt"></span></button>
    <button class="act" id="actAbil2"><span class="ico"></span><span class="k">V</span><span class="cd"></span><span class="cdt"></span><span class="lock" hidden><svg viewBox="0 0 32 32"><rect x="9" y="15" width="14" height="11" rx="2" fill="#c9a24a" stroke="#24180f" stroke-width="1.4"/><path d="M12 15v-4a4 4 0 0 1 8 0v4" fill="none" stroke="#24180f" stroke-width="2.4"/></svg><b>5</b></span></button>
    <button class="act tr" id="actTrinket" hidden><span class="ico"></span><span class="k">1</span><span class="cd"></span><span class="cdt"></span></button>
    <button class="act" id="actPot"><span class="ico"></span><span class="k">Q</span><span class="n"></span><span class="cd"></span><span class="cdt"></span></button>
  </div>
  <div id="sideBtns"><button class="sq" id="btnMap" title="Карта — K"></button><button class="sq" id="btnBag" title="Персонаж и сумка — I"></button><button class="sq" id="btnMenu" title="Меню — Esc"></button></div>
  <div id="touch"></div>
</div>
