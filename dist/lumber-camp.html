  .btn.wb{font-size:14px;min-height:36px;padding:6px 12px;gap:6px} .btn.wb svg.ico{width:16px;height:16px} .btn.wb.big{font-size:18px;min-height:44px;padding:8px 26px} #selBottom .btn{min-width:220px}
