<!doctype html><meta charset=utf-8><body style="margin:0;background:#0b0f0c"><canvas id=c width=1500 height=700></canvas>
<script src="worldgen.js"></script><script>
const cv=document.getElementById('c'),c=cv.getContext('2d');c.fillStyle='#0b0f0c';c.fillRect(0,0,1500,700);
const TW=360,TH=300;
let OX=0,OY=0;function tile(ix,iy,name,mech,fn,seed){const x0=12+ix*372,y0=12+iy*340;OX=x0;OY=y0;c.save();c.beginPath();c.rect(x0,y0,TW,TH);c.clip();c.translate(x0,y0);const rng=mulberry(seed);const n=vnoise(seed);fn(rng,n);c.restore();
  c.strokeStyle='#2a332b';c.lineWidth=2;c.strokeRect(x0,y0,TW,TH);c.fillStyle='#ece6d3';c.font='700 15px sans-serif';c.fillText(name,x0+2,y0+TH+18);c.fillStyle='#98a191';c.font='12px sans-serif';c.fillText(mech,x0+2,y0+TH+34)}
function ground(n,base,var_,sc=60){const id=c.createImageData(TW,TH);for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const v=(n(x/sc,y/sc)-0.5)*var_+(n(x/9+50,y/9)-0.5)*var_*0.35;const o=(y*TW+x)*4;id.data[o]=base[0]+v;id.data[o+1]=base[1]+v;id.data[o+2]=base[2]+v;id.data[o+3]=255}c.putImageData(id,OX,OY)}
// зомби в облике биома
function zom(x,y,r,col,extra){c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x+2,y+r*0.8,r*0.9,r*0.4,0,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#ff5a44';c.fillRect(x-4,y-r*0.35,2.5,2.5);c.fillRect(x+2,y-r*0.35,2.5,2.5);if(extra)extra(x,y,r)}
function shadow(x,y,r){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(x+4,y+r*0.5,r*0.95,r*0.5,0,0,7);c.fill()}
// --- деревья
function birch(x,y,r,rng){shadow(x,y,r);c.fillStyle='#e8e4d8';c.fillRect(x-2,y-2,4,8);for(let k=0;k<5;k++){c.fillStyle=k%2?'#8fbf5a':'#a8d070';c.beginPath();c.arc(x+(rng()-0.5)*r*0.8,y-r*0.3+(rng()-0.5)*r*0.6,r*0.55,0,7);c.fill()}}
function snowFir(x,y,r){shadow(x,y,r);for(const [rr,col] of [[1,'#1f4436'],[0.74,'#2c5a48'],[0.5,'#3a6e58'],[0.28,'#4f8a6e']]){c.fillStyle=col;c.beginPath();for(let i=0;i<18;i++){const a=i/18*6.283,q=i%2?rr*r*0.7:rr*r;c.lineTo(x+Math.cos(a)*q,y-4+Math.sin(a)*q)}c.fill()}
  c.fillStyle='rgba(250,253,255,.95)';c.beginPath();c.ellipse(x-r*0.25,y-4-r*0.3,r*0.55,r*0.32,-0.4,0,7);c.fill();c.beginPath();c.ellipse(x+r*0.35,y-4+r*0.1,r*0.3,r*0.2,0.3,0,7);c.fill();c.beginPath();c.ellipse(x-r*0.45,y-4+r*0.4,r*0.25,r*0.15,0.2,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y-4,r*0.14,0,7);c.fill()}
function willow(x,y,r,rng){shadow(x,y,r);c.fillStyle='#3e5a3a';c.beginPath();c.arc(x,y-3,r*0.95,0,7);c.fill();c.strokeStyle='#5d7a48';c.lineWidth=1.5;for(let i=0;i<18;i++){const a=i/18*6.283;c.beginPath();c.moveTo(x+Math.cos(a)*r*0.3,y-3+Math.sin(a)*r*0.3);c.quadraticCurveTo(x+Math.cos(a)*r*0.9,y-3+Math.sin(a)*r*0.7,x+Math.cos(a)*r*1.05,y+2+Math.sin(a)*r*1.05);c.stroke()}}
function mushroom(x,y,r,rng,col){shadow(x,y,r);c.fillStyle='#d8cfc0';c.fillRect(x-3,y,6,8);const g=c.createRadialGradient(x-r*0.3,y-r*0.4,2,x,y-2,r);g.addColorStop(0,'#e8a0d8');g.addColorStop(1,col);c.fillStyle=g;c.beginPath();c.arc(x,y-2,r,0,7);c.fill();c.fillStyle='rgba(255,255,240,.85)';for(let i=0;i<6;i++){c.beginPath();c.arc(x+(rng()-0.5)*r*1.3,y-2+(rng()-0.5)*r*1.3,1.5+rng()*2.5,0,7);c.fill()}
  c.fillStyle='rgba(200,140,255,.25)';c.beginPath();c.arc(x,y-2,r*1.35,0,7);c.fill()}
function thorn(x,y,r,rng){shadow(x,y,r*0.7);c.strokeStyle='#3a2018';c.lineWidth=3;c.lineCap='round';for(let i=0;i<6;i++){const a=rng()*6.283,l=r*(0.6+rng()*0.5);c.beginPath();c.moveTo(x,y);const mx=x+Math.cos(a)*l*0.5,my=y+Math.sin(a)*l*0.5;c.lineTo(mx,my);c.lineTo(x+Math.cos(a+0.4)*l,y+Math.sin(a+0.4)*l);c.stroke()}c.fillStyle='#5a2a1c';c.beginPath();c.arc(x,y,4,0,7);c.fill()}
function pine(x,y,r){shadow(x,y,r);for(const [rr,col] of [[1,'#2d4a34'],[0.68,'#3b5f42'],[0.38,'#4f7a52']]){c.fillStyle=col;c.beginPath();for(let i=0;i<14;i++){const a=i/14*6.283,q=i%2?rr*r*0.65:rr*r;c.lineTo(x+Math.cos(a)*q,y-3+Math.sin(a)*q)}c.fill()}}
function mangrove(x,y,r,rng){shadow(x,y,r);c.strokeStyle='#1e2622';c.lineWidth=2;for(let i=0;i<7;i++){const a=i/7*6.283;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*r*0.6,y+Math.sin(a)*r*0.2-4,x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*0.6+4);c.stroke()}c.fillStyle='#24302c';c.beginPath();c.arc(x,y-6,r*0.75,0,7);c.fill();c.fillStyle='#2f3e38';c.beginPath();c.arc(x-r*0.2,y-9,r*0.45,0,7);c.fill()}
function deadTree(x,y,r,rng){shadow(x,y,r*0.7);c.strokeStyle='#3c3240';c.lineWidth=4;c.lineCap='round';for(let i=0;i<5;i++){const a=rng()*6.283,l=r*(0.5+rng()*0.6);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}}
function scatter(rng,n,f,margin=20){const pts=[];for(let i=0;i<n;i++){let x,y,t=0;do{x=margin+rng()*(TW-2*margin);y=margin+rng()*(TH-2*margin);t++}while(t<30&&pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<34));pts.push([x,y]);f(x,y)}}
// 1 Берёзовая роща (улучшенная)
tile(0,0,'Берёзовая роща (было → станет детальнее)','трава, цветы, грибы; на 10% больше берёз',(rng,n)=>{ground(n,[86,118,58],26);
  for(let i=0;i<160;i++){c.strokeStyle=rng()<0.5?'#6f9a48':'#a0c070';c.lineWidth=1;const x=rng()*TW,y=rng()*TH;c.beginPath();c.moveTo(x,y);c.lineTo(x-2,y-5);c.moveTo(x,y);c.lineTo(x+2,y-5);c.stroke()}
  for(let i=0;i<40;i++){c.fillStyle=['#f4e27a','#ffffff','#c9a0e0','#f2a0a0'][i%4];c.beginPath();c.arc(rng()*TW,rng()*TH,2,0,7);c.fill()}
  scatter(rng,11,(x,y)=>birch(x,y,15,rng));zom(260,230,12,'#6f7d5a')},11);
// 2 Снежный край
tile(1,0,'Снежный край','Ледяная ель · сугробы замедляют · босс Ледяной великан',(rng,n)=>{ground(n,[222,232,240],22,50);
  for(let i=0;i<14;i++){const x=rng()*TW,y=rng()*TH,w=20+rng()*40;c.fillStyle='rgba(160,185,210,.35)';c.beginPath();c.ellipse(x+3,y+4,w,w*0.35,0.2,0,7);c.fill();c.fillStyle='#f6faff';c.beginPath();c.ellipse(x,y,w,w*0.35,0.2,0,7);c.fill()}
  c.fillStyle='rgba(150,200,235,.55)';c.beginPath();c.ellipse(90,210,60,26,0.3,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.7)';c.beginPath();c.moveTo(60,205);c.lineTo(110,215);c.stroke();
  scatter(rng,8,(x,y)=>snowFir(x,y,22));zom(250,140,13,'#7a8a98',(x,y,r)=>{c.fillStyle='rgba(230,245,255,.75)';c.beginPath();c.arc(x,y,r,Math.PI+0.3,2*Math.PI-0.3);c.fill();c.fillStyle='#bfe6ff';for(const dx of [-6,0,6]){c.beginPath();c.moveTo(x+dx-2,y-r*0.9);c.lineTo(x+dx,y-r*1.4);c.lineTo(x+dx+2,y-r*0.9);c.fill()}})},22);
// 3 Болотный край
tile(2,0,'Болотный край (мир 2)','болотная ива · вода замедляет · кочки и камыш',(rng,n)=>{ground(n,[70,86,58],24);
  for(let i=0;i<7;i++){const x=rng()*TW,y=rng()*TH,w=30+rng()*40;c.fillStyle='#2f5450';c.beginPath();c.ellipse(x,y,w,w*0.55,rng(),0,7);c.fill();c.fillStyle='rgba(120,170,160,.25)';c.beginPath();c.ellipse(x-w*0.2,y-w*0.1,w*0.5,w*0.2,0.2,0,7);c.fill();
    for(let k=0;k<3;k++){c.fillStyle='#5a8a3a';c.beginPath();c.arc(x+(rng()-0.5)*w,y+(rng()-0.5)*w*0.5,4,0.3,6);c.lineTo(x,y);c.fill()}
    c.strokeStyle='#8a8a50';c.lineWidth=1.5;for(let k=0;k<6;k++){const rx=x+w*(rng()>0.5?0.9:-0.9)+(rng()-0.5)*8,ry=y+(rng()-0.5)*w*0.4;c.beginPath();c.moveTo(rx,ry);c.lineTo(rx+(rng()-0.5)*4,ry-10);c.stroke()}}
  scatter(rng,7,(x,y)=>willow(x,y,18,rng));zom(200,150,13,'#4f6a4a',(x,y,r)=>{c.strokeStyle='#5d7a48';c.lineWidth=1.5;for(let i=0;i<4;i++){c.beginPath();c.moveTo(x-r*0.6+i*5,y-r*0.6);c.lineTo(x-r*0.7+i*5,y+r*0.2);c.stroke()}})},33);
// 4 Грибной лес
tile(3,0,'Грибной лес (мир 2)','гигантские грибы вместо деревьев · облака спор',(rng,n)=>{ground(n,[58,44,66],22);
  for(let i=0;i<70;i++){c.fillStyle=`rgba(210,160,255,${0.2+rng()*0.5})`;c.beginPath();c.arc(rng()*TW,rng()*TH,1+rng()*1.5,0,7);c.fill()}
  c.fillStyle='rgba(170,230,120,.18)';c.beginPath();c.arc(270,90,50,0,7);c.fill();c.fillStyle='rgba(170,230,120,.12)';c.beginPath();c.arc(290,105,34,0,7);c.fill();
  scatter(rng,8,(x,y)=>mushroom(x,y,16+rng()*6,rng,['#8a3a8a','#6a3aa0','#a04a6a'][Math.floor(rng()*3)]));zom(120,230,12,'#6a5a7a',(x,y,r)=>{c.fillStyle='#c76fb0';c.beginPath();c.arc(x+r*0.4,y-r*0.5,r*0.45,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+r*0.3,y-r*0.6,1.5,0,7);c.fill()})},44);
// 5 Красная пустошь
tile(0,1,'Красная пустошь (мир 3)','кривые колючие деревья · раскалённая земля, кости',(rng,n)=>{ground(n,[150,80,52],30,45);
  c.strokeStyle='rgba(70,30,20,.5)';c.lineWidth=1.2;for(let i=0;i<26;i++){let x=rng()*TW,y=rng()*TH;c.beginPath();c.moveTo(x,y);for(let k=0;k<4;k++){x+=(rng()-0.5)*30;y+=(rng()-0.5)*30;c.lineTo(x,y)}c.stroke()}
  for(let i=0;i<8;i++){c.fillStyle='#e0d8c4';const x=rng()*TW,y=rng()*TH;c.fillRect(x,y,10,3);c.beginPath();c.arc(x,y+1.5,3,0,7);c.arc(x+10,y+1.5,3,0,7);c.fill()}
  for(let i=0;i<6;i++){c.fillStyle='#7a4a34';c.beginPath();c.arc(rng()*TW,rng()*TH,6+rng()*8,0,7);c.fill()}
  scatter(rng,6,(x,y)=>thorn(x,y,18,rng));zom(240,150,13,'#8a5a40',(x,y,r)=>{c.fillStyle='#e0d8c4';c.beginPath();c.arc(x,y,r,Math.PI+0.3,2*Math.PI-0.3);c.fill();c.fillStyle='#1a1410';c.fillRect(x-5,y-r*0.6,3,3);c.fillRect(x+2,y-r*0.6,3,3)})},55);
// 6 Скалистое нагорье
tile(1,1,'Скалистое нагорье (мир 3)','горная сосна · непроходимые утёсы · много железа',(rng,n)=>{ground(n,[118,114,104],30,40);
  for(let i=0;i<5;i++){const x=rng()*TW,y=rng()*TH,w=30+rng()*30;c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x+6,y+8,w,w*0.7,0,0,7);c.fill();c.fillStyle='#6e6a62';c.beginPath();for(let k=0;k<8;k++){const a=k/8*6.283,q=w*(0.75+rng()*0.3);c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q*0.7)}c.fill();c.fillStyle='#8f8b82';c.beginPath();c.ellipse(x-w*0.2,y-w*0.2,w*0.5,w*0.3,0,0,7);c.fill()}
  for(let i=0;i<5;i++){const x=rng()*TW,y=rng()*TH;c.fillStyle='#55606e';c.beginPath();c.arc(x,y,7,0,7);c.fill();c.fillStyle='#c9d4e0';c.fillRect(x-2,y-2,3,3)}
  scatter(rng,6,(x,y)=>pine(x,y,15));zom(170,240,13,'#6a6a6a',(x,y,r)=>{c.fillStyle='#8e959b';c.beginPath();c.arc(x,y,r*1.02,Math.PI+0.32,2*Math.PI-0.32);c.fill()})},66);
// 7 Туманная топь
tile(2,1,'Туманная топь (мир 3)','чёрные мангры · густой туман: видно только рядом',(rng,n)=>{ground(n,[64,78,80],20);
  for(let i=0;i<6;i++){const x=rng()*TW,y=rng()*TH,w=30+rng()*40;c.fillStyle='#22383c';c.beginPath();c.ellipse(x,y,w,w*0.5,rng(),0,7);c.fill()}
  scatter(rng,8,(x,y)=>mangrove(x,y,17,rng));
  for(let i=0;i<6;i++){const x=rng()*TW,y=rng()*TH;const g=c.createRadialGradient(x,y,1,x,y,10);g.addColorStop(0,'rgba(180,255,220,.9)');g.addColorStop(1,'rgba(180,255,220,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,10,0,7);c.fill()}
  zom(180,150,13,'#4a5a5a');const g=c.createRadialGradient(180,150,40,180,150,220);g.addColorStop(0,'rgba(200,215,220,0)');g.addColorStop(1,'rgba(200,215,220,.75)');c.fillStyle=g;c.fillRect(0,0,TW,TH)},77);
// 8 Переход зон
tile(3,1,'Граница зон: плавный переход','Берёзовая роща → Сосновый бор, без резкого круга',(rng,n)=>{
  const id=c.createImageData(TW,TH);for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const edge=TW*0.5+(n(y/50,3)-0.5)*120,t=Math.max(0,Math.min(1,(x-edge+40)/80)),v=(n(x/40,y/40)-0.5)*24;const a=[86,118,58],b=[40,80,60];const o=(y*TW+x)*4;id.data[o]=a[0]+(b[0]-a[0])*t+v;id.data[o+1]=a[1]+(b[1]-a[1])*t+v;id.data[o+2]=a[2]+(b[2]-a[2])*t+v;id.data[o+3]=255}c.putImageData(id,OX,OY);
  scatter(rng,14,(x,y)=>{const edge=TW*0.5+(n(y/50,3)-0.5)*120;if(x+(rng()-0.5)*60<edge)birch(x,y,14,rng);else pine(x,y,15)})},88);
document.title='done';
</script>
