<!doctype html><meta charset=utf-8><body style="margin:0;background:#07090a"><canvas id=c></canvas>
<script src="worldgen.js"></script><script>
const mode=new URLSearchParams(location.search).get('m')||'plan';
const cv=document.getElementById('c'),c=cv.getContext('2d');
const rng=mulberry(9),N=vnoise(5);
function floor(x0,y0,w,h,base,tile=26){for(let y=y0;y<y0+h;y+=tile)for(let x=x0;x<x0+w;x+=tile){const v=(N(x/90,y/90)-0.5)*22+(rng()-0.5)*8;c.fillStyle=`rgb(${base[0]+v},${base[1]+v},${base[2]+v})`;c.fillRect(x,y,tile-1,tile-1)}}
function roomPath(r){c.beginPath();const {x,y,w,h,shape}=r;
  if(shape==='round'){c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7)}
  else if(shape==='oct'){const k=w*0.29;c.moveTo(x+k,y);c.lineTo(x+w-k,y);c.lineTo(x+w,y+k);c.lineTo(x+w,y+h-k);c.lineTo(x+w-k,y+h);c.lineTo(x+k,y+h);c.lineTo(x,y+h-k);c.lineTo(x,y+k)}
  else if(shape==='cross'){const a=w/3,b=h/3;c.moveTo(x+a,y);c.lineTo(x+2*a,y);c.lineTo(x+2*a,y+b);c.lineTo(x+w,y+b);c.lineTo(x+w,y+2*b);c.lineTo(x+2*a,y+2*b);c.lineTo(x+2*a,y+h);c.lineTo(x+a,y+h);c.lineTo(x+a,y+2*b);c.lineTo(x,y+2*b);c.lineTo(x,y+b);c.lineTo(x+a,y+b)}
  else if(shape==='L'){c.moveTo(x,y);c.lineTo(x+w*0.45,y);c.lineTo(x+w*0.45,y+h*0.55);c.lineTo(x+w,y+h*0.55);c.lineTo(x+w,y+h);c.lineTo(x,y+h)}
  else c.rect(x,y,w,h);c.closePath()}
function drawRoom(r,base){c.save();roomPath(r);c.fillStyle='#0d0f10';c.lineWidth=22;c.strokeStyle='#1a1d20';c.stroke();c.clip();floor(r.x-10,r.y-10,r.w+20,r.h+20,base);c.restore();
  c.save();roomPath(r);c.lineWidth=6;c.strokeStyle='#4a4f56';c.stroke();c.lineWidth=2;c.strokeStyle='#7a7f86';c.stroke();c.restore()}
function torch(x,y){const g=c.createRadialGradient(x,y,2,x,y,60);g.addColorStop(0,'rgba(255,170,80,.45)');g.addColorStop(1,'rgba(255,170,80,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,60,0,7);c.fill();c.fillStyle='#3a2a1c';c.fillRect(x-3,y-2,6,8);c.fillStyle='#ffb347';c.beginPath();c.moveTo(x-4,y-2);c.quadraticCurveTo(x,y-14,x+4,y-2);c.fill()}
function column(x,y,r=12){c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.arc(x+4,y+5,r,0,7);c.fill();c.fillStyle='#5a5f66';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#7a7f86';c.beginPath();c.arc(x-3,y-3,r*0.5,0,7);c.fill()}
function corridor(a,b){c.strokeStyle='#1a1d20';c.lineWidth=60;c.lineCap='butt';c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.strokeStyle='#3a3f44';c.lineWidth=40;c.stroke()}
function hero(x,y){c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x+2,y+11,12,5,0,0,7);c.fill();c.fillStyle='#c4672a';c.beginPath();c.arc(x,y,12,0,7);c.fill();c.fillStyle='#2b2219';c.beginPath();c.arc(x,y-3,7,0,7);c.fill()}
function label(x,y,t,col='#ece6d3',fs=13,b=600){c.font=`${b} ${fs}px sans-serif`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.8)';c.strokeText(t,x,y);c.fillStyle=col;c.fillText(t,x,y)}
function badge(x,y,lines){c.fillStyle='rgba(14,19,15,.9)';c.strokeStyle='#c08ae8';c.lineWidth=1.5;const w=270,h=18+lines.length*18;c.beginPath();c.roundRect(x,y,w,h,8);c.fill();c.stroke();c.textAlign='left';lines.forEach((l,i)=>{c.font=i?'12px sans-serif':'700 14px sans-serif';c.fillStyle=i?'#c9c2b0':'#e0c0ff';c.fillText(l,x+12,y+20+i*18)})}
if(mode==='plan'){
  cv.width=1500;cv.height=820;c.fillStyle='#07090a';c.fillRect(0,0,1500,820);
  const R=[{x:60,y:330,w:200,h:150,shape:'rect',t:'Вход'},{x:340,y:290,w:230,h:230,shape:'round',t:'Зал 1: круглый'},{x:650,y:80,w:260,h:260,shape:'cross',t:'Зал 2: крест'},{x:650,y:470,w:300,h:180,shape:'rect',cols:true,t:'Зал 3: галерея с колоннами'},{x:1010,y:260,w:150,h:300,shape:'L',t:'Зал 4: угловой'},{x:1180,y:180,w:300,h:440,shape:'oct',final:true,t:'Последний зал: логово'}];
  corridor([260,405],[340,405]);corridor([540,350],[780,340]);corridor([500,480],[650,560]);corridor([910,210],[1080,260]);corridor([950,560],[1060,560]);corridor([1160,420],[1180,420]);
  R.forEach((r,i)=>{drawRoom(r,r.final?[50,64,44]:[54,56,60]);if(r.cols)for(let k=0;k<4;k++){column(r.x+50+k*67,r.y+55);column(r.x+50+k*67,r.y+125)}
    if(r.shape==='round')column(r.x+r.w/2,r.y+r.h/2,22);
    if(r.final){c.save();roomPath(r);c.clip();for(let k=0;k<14;k++){c.fillStyle='rgba(110,190,80,.45)';c.beginPath();c.ellipse(r.x+30+rng()*(r.w-60),r.y+30+rng()*(r.h-60),12+rng()*26,8+rng()*14,rng()*3,0,7);c.fill()}c.restore();
      c.fillStyle='rgba(110,190,80,.9)';c.beginPath();c.ellipse(r.x+r.w/2,r.y+r.h/2,40,32,0,0,7);c.fill();c.fillStyle='#f4c766';c.fillRect(r.x+r.w/2-14,r.y+r.h/2-40,28,8)}
    label(r.x+r.w/2,r.y-14,r.t,r.final?'#9fe08a':'#ece6d3')});
  for(const [x,y] of [[360,300],[550,300],[670,100],[890,100],[670,480],[930,480],[1200,200],[1460,200],[1200,600],[1460,600]])torch(x,y);
  // враги в залах
  for(const [x,y] of [[420,380],[480,430],[740,200],[820,230],[780,170],[760,560],[860,600],[1060,520],[1100,500]]){c.fillStyle='#5d6e63';c.beginPath();c.arc(x,y,11,0,7);c.fill();c.fillStyle='#ff5a44';c.fillRect(x-4,y-4,2.5,2.5);c.fillRect(x+2,y-4,2.5,2.5)}
  // сундук и мимик в галерее
  c.fillStyle='#8d6540';c.fillRect(905,515,24,16);c.fillStyle='#f4c766';c.fillRect(914,520,6,5);label(917,548,'сундук?','#f4c766',11,500);
  hero(140,410);
  badge(20,20,['Склеп Королевы слизи','Пройдено: 7 раз · сложность 9','Ключей: 2 · гарантия комплекта через 8']);
  c.textAlign='left';c.font='13px sans-serif';c.fillStyle='#98a191';c.fillText('Пример раскладки. Каждый поход: другой набор форм (круг, крест, восьмиугольник, галерея с колоннами, угловой зал), 4–6 залов, последний — логово случайного побеждённого босса.',20,800);
}
else{
  cv.width=1500;cv.height=560;c.fillStyle='#07090a';c.fillRect(0,0,1500,560);
  const P=[{t:'slime',x:10},{t:'treant',x:510},{t:'dragon',x:1010}];
  for(const p of P){const x0=p.x,y0=60,W=480,H=440,cx=x0+W/2,cy=y0+H/2-10;c.save();c.beginPath();c.rect(x0,y0,W,H);c.clip();
    const r={x:x0+20,y:y0+20,w:W-40,h:H-40,shape:'oct'};
    if(p.t==='slime'){drawRoom(r,[46,62,40]);c.save();roomPath(r);c.clip();
      for(let k=0;k<26;k++){c.fillStyle=`rgba(110,190,80,${0.25+rng()*0.35})`;c.beginPath();c.ellipse(x0+40+rng()*(W-80),y0+40+rng()*(H-80),10+rng()*30,6+rng()*16,rng()*3,0,7);c.fill()}
      for(let k=0;k<10;k++){const ex=x0+50+rng()*(W-100),ey=y0+50+rng()*(H-100);c.fillStyle='rgba(190,240,150,.7)';c.beginPath();c.ellipse(ex,ey,7,9,0,0,7);c.fill();c.strokeStyle='rgba(60,110,40,.8)';c.stroke()}
      for(let k=0;k<6;k++){c.fillStyle='#4f7a3a';c.beginPath();c.ellipse(x0+30+rng()*(W-60),y0+30+rng()*(H-60),14,7,rng()*3,0,7);c.fill()}
      c.restore();
      c.fillStyle='rgba(126,200,255,.18)';c.beginPath();c.arc(cx,cy,62,0,7);c.fill();c.strokeStyle='rgba(126,200,255,.8)';c.lineWidth=3;c.setLineDash([8,5]);c.beginPath();c.arc(cx,cy,62,0,7);c.stroke();c.setLineDash([]);
      c.fillStyle='rgba(110,190,80,.95)';c.beginPath();c.ellipse(cx,cy,46,38,0,0,7);c.fill();c.fillStyle='rgba(200,255,160,.5)';c.beginPath();c.ellipse(cx-14,cy-14,14,8,-0.4,0,7);c.fill();c.fillStyle='#f4c766';c.beginPath();c.moveTo(cx-18,cy-36);c.lineTo(cx-12,cy-50);c.lineTo(cx-4,cy-38);c.lineTo(cx+4,cy-52);c.lineTo(cx+12,cy-38);c.lineTo(cx+18,cy-50);c.lineTo(cx+20,cy-34);c.fill();c.fillStyle='#1d2a14';c.fillRect(cx-12,cy-8,5,5);c.fillRect(cx+7,cy-8,5,5);
      for(const [a,d] of [[0.4,120],[1.6,130],[2.8,115],[4,125],[5.2,120]]){const sx=cx+Math.cos(a)*d,sy=cy+Math.sin(a)*d;c.fillStyle='rgba(110,190,80,.9)';c.beginPath();c.ellipse(sx,sy,13,10,0,0,7);c.fill();c.fillStyle='#1d2a14';c.fillRect(sx-4,sy-3,2.5,2.5);c.fillRect(sx+2,sy-3,2.5,2.5)}
      hero(cx,y0+H-70);c.restore();
      phase(x0,'Королева слизи',1,'Слуги','Щит держится, пока живы слизни — бейте их');
    }
    if(p.t==='treant'){drawRoom(r,[52,58,42]);c.save();roomPath(r);c.clip();
      c.strokeStyle='#4a3424';c.lineCap='round';for(let k=0;k<12;k++){const a=k/12*6.283;c.lineWidth=10-k%3*2;c.beginPath();c.moveTo(cx,cy);let x=cx,y=cy;for(let s=0;s<5;s++){x+=Math.cos(a+(rng()-0.5)*0.8)*45;y+=Math.sin(a+(rng()-0.5)*0.8)*45;c.lineTo(x,y)}c.stroke()}
      for(let k=0;k<30;k++){c.fillStyle=`rgba(90,140,60,${0.3+rng()*0.4})`;c.beginPath();c.arc(x0+30+rng()*(W-60),y0+30+rng()*(H-60),4+rng()*10,0,7);c.fill()}
      for(let k=0;k<8;k++){const gx=x0+40+rng()*(W-80),gy=y0+40+rng()*(H-80),g=c.createRadialGradient(gx,gy,1,gx,gy,14);g.addColorStop(0,'rgba(180,255,200,.9)');g.addColorStop(1,'rgba(180,255,200,0)');c.fillStyle=g;c.beginPath();c.arc(gx,gy,14,0,7);c.fill()}
      for(const [mx,my] of [[cx-120,cy+70],[cx+90,cy+110],[cx+140,cy-60],[cx-60,cy+150]]){c.fillStyle='rgba(207,75,63,.25)';c.beginPath();c.arc(mx,my,34,0,7);c.fill();c.strokeStyle='rgba(255,90,70,.9)';c.lineWidth=2;c.setLineDash([6,4]);c.beginPath();c.arc(mx,my,34,0,7);c.stroke();c.setLineDash([])}
      c.restore();
      c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(cx+6,cy+10,56,30,0,0,7);c.fill();for(const [rr,col] of [[54,'#2f4a2a'],[40,'#3d5f34'],[26,'#4f7a42']]){c.fillStyle=col;c.beginPath();c.arc(cx,cy-6,rr,0,7);c.fill()}c.fillStyle='#5a3e28';c.beginPath();c.arc(cx,cy-6,14,0,7);c.fill();c.fillStyle='#f4e27a';c.fillRect(cx-8,cy-10,4,4);c.fillRect(cx+4,cy-10,4,4);
      hero(cx-40,y0+H-80);c.restore();
      phase(x0,'Древень',2,'Корни','Красные круги — сюда ударят корни. Уходите и бейте в паузах');
    }
    if(p.t==='dragon'){drawRoom(r,[48,40,38]);c.save();roomPath(r);c.clip();c.fillStyle='rgba(120,20,10,.25)';c.fillRect(x0,y0,W,H);
      c.strokeStyle='#ff7a2a';c.lineWidth=3;for(let k=0;k<10;k++){let x=x0+40+rng()*(W-80),y=y0+40+rng()*(H-80);c.beginPath();c.moveTo(x,y);for(let s=0;s<5;s++){x+=(rng()-0.5)*50;y+=(rng()-0.5)*50;c.lineTo(x,y)}c.stroke()}
      for(let k=0;k<14;k++){const ox=x0+40+rng()*(W-80),oy=y0+40+rng()*(H-80);c.fillStyle='#1a1418';c.beginPath();c.moveTo(ox,oy-14-rng()*10);c.lineTo(ox+8+rng()*6,oy+6);c.lineTo(ox-8-rng()*6,oy+6);c.fill();c.fillStyle='rgba(176,122,255,.35)';c.beginPath();c.moveTo(ox,oy-12);c.lineTo(ox+3,oy+2);c.lineTo(ox-2,oy+2);c.fill()}
      c.fillStyle='#d8b44a';c.beginPath();c.ellipse(x0+90,y0+90,40,22,0,0,7);c.fill();for(let k=0;k<20;k++){c.fillStyle='#f4e27a';c.beginPath();c.arc(x0+60+rng()*60,y0+76+rng()*28,3,0,7);c.fill()}
      for(let k=0;k<6;k++){c.fillStyle='#e0d8c4';const bx=x0+60+rng()*(W-120),by=y0+60+rng()*(H-120);c.fillRect(bx,by,12,3)}
      c.restore();
      c.fillStyle='rgba(255,60,30,.15)';c.fillRect(x0,y0,W,H);
      c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(cx+10,cy+16,60,26,0,0,7);c.fill();
      c.fillStyle='#7a2418';for(const s of [-1,1]){c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+s*110,cy-40);c.lineTo(cx+s*90,cy+10);c.lineTo(cx+s*60,cy+20);c.closePath();c.fill()}
      c.fillStyle='#a8341f';c.beginPath();c.ellipse(cx,cy,26,40,0,0,7);c.fill();c.beginPath();c.ellipse(cx,cy-46,14,16,0,0,7);c.fill();c.fillStyle='#ffb347';c.fillRect(cx-7,cy-50,4,4);c.fillRect(cx+3,cy-50,4,4);
      {const hx=cx,hy=cy-60,tx=cx-90,ty=y0+H-70;const g=c.createLinearGradient(hx,hy,tx,ty);g.addColorStop(0,'rgba(255,240,150,.95)');g.addColorStop(1,'rgba(255,90,30,.15)');c.fillStyle=g;const a=Math.atan2(ty-hy,tx-hx),L=Math.hypot(tx-hx,ty-hy);c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+Math.cos(a-0.28)*L,hy+Math.sin(a-0.28)*L);c.quadraticCurveTo(tx+Math.cos(a)*30,ty+Math.sin(a)*30,hx+Math.cos(a+0.28)*L,hy+Math.sin(a+0.28)*L);c.closePath();c.fill()}
      hero(cx+70,y0+H-80);c.restore();
      phase(x0,'Крылатый змей',3,'Ярость','Огонь чаще и быстрее. Держитесь сбоку, бейте после выдоха');
    }
  }
  function phase(x0,name,n,title,hint){c.fillStyle='rgba(14,19,15,.88)';c.fillRect(x0,0,480,58);c.textAlign='center';c.font='700 14px sans-serif';c.fillStyle='#f2b8b0';c.fillText(name,x0+240,18);
    for(let i=0;i<3;i++){c.fillStyle='#000';c.fillRect(x0+90+i*102,26,96,8);c.fillStyle=i<3-n+1?'#cf4b3f':'#3a1e1c';c.fillRect(x0+90+i*102,26,i<3-n?96:i===3-n?60:0,8)}
    c.font='700 13px sans-serif';c.fillStyle='#ffd34d';c.fillText(`Фаза ${n} из 3: ${title}`,x0+240,50);c.font='12px sans-serif';c.fillStyle='#ece6d3';c.textAlign='center';
    c.fillStyle='rgba(14,19,15,.85)';c.fillRect(x0,500,480,56);c.fillStyle='#ece6d3';c.fillText(hint,x0+240,522);c.fillStyle='#98a191';c.fillText('Пройдено: 7 раз · сложность 9',x0+240,542)}
}
document.title='done';
</script>
