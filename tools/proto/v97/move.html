</style><body><h1>Мультяшный герой в движении — эскиз</h1><p>Один пример: фиолетовые латы «Чёрный полководец». Объёмная кукла: части тела поворачиваются вместе с героем, плоские детали (забрало, знак на груди) видны, когда их сторона повёрнута к нам. Всё живое — шаг и удар идут сами.</p><div id="root"></div><script>(() => {
