<h1>Грибной лес — эскиз v65</h1>
<p>Третья зона (ур. 10–14): мох, поваленные стволы, туман, Квакуны и Грибоеды, пауки, редкий вожак — Великий Полоз, стоянка купца с тележкой, железо. И новые звери первых двух зон в том же подробном стиле, что герои v64. Всё ниже движется так же, как будет в игре.</p>
</div>
