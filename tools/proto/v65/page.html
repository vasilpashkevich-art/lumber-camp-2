<title>Грибной лес v65</title>
<style>
:root{color-scheme:dark;--bg:#12160f;--pan:#1e2418;--line:#4a5a3a;--txt:#e6e8d4;--dim:#a8b090;--hi:#e8f0b0}
body{background:var(--bg);color:var(--txt);font:15px Georgia,'Times New Roman',serif;margin:0;padding:18px 16px 60px}
#main{max-width:1200px;margin:0 auto}
h1{margin:0 0 4px;color:var(--hi);font-size:28px} h2{color:var(--hi);font-size:21px;margin:30px 0 6px}
p{color:var(--dim);max-width:920px;line-height:1.5;margin:4px 0 10px}
canvas{display:block;border-radius:8px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(590px,1fr));gap:12px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card b{color:var(--hi);font-weight:normal;font-size:16px} small{color:var(--dim);font-size:12px}
.icons{display:flex;gap:16px;margin-top:10px}.ic{display:flex;align-items:center;gap:10px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 8px}
.svgic{background:radial-gradient(circle at 50% 40%,#e8e4da33,#1a120c 70%);border:2px solid #e8e4da;border-radius:6px}
</style>
<div id="main">
<h1>Грибной лес — эскиз v65</h1>
<p>Третья зона (ур. 10–14): мох, поваленные стволы, туман, Квакуны и Грибоеды, пауки, редкий вожак — Великий Полоз, стоянка купца с тележкой, железо. И новые звери первых двух зон в том же подробном стиле, что герои v64. Всё ниже движется так же, как будет в игре.</p>
</div>
