<title>Герои и вещи v64</title>
<style>
:root{color-scheme:dark;--bg:#14100b;--pan:#221a12;--line:#5a4630;--txt:#e9dfc8;--dim:#a89878;--hi:#ffe9a8;--gold:#e7c35a}
body{background:var(--bg);color:var(--txt);font:15px Georgia,'Times New Roman',serif;margin:0;padding:18px 16px 60px}
#main{max-width:1240px;margin:0 auto}
h1{margin:0 0 4px;color:var(--hi);font-size:28px} h2{color:var(--hi);font-size:21px;margin:30px 0 6px}
p{color:var(--dim);max-width:900px;line-height:1.5;margin:4px 0 10px}
canvas{display:block;border-radius:8px;max-width:100%}
.row,.cells{display:flex;flex-wrap:wrap;gap:10px}
.card,.wcard,.acard,.jcard{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card b,.wcard b,.acard b,.jcard b{color:var(--hi);font-weight:normal;font-size:16px}
small{color:var(--dim);font-size:12px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cell{box-sizing:border-box;border:2px solid;border-radius:7px;background:radial-gradient(circle at 40% 35%,#3a2e22,#15100a);display:grid;place-items:center}
.cell.ep{box-shadow:0 0 8px #b46aff88}
.ci{display:flex;align-items:center;gap:6px;min-width:150px}.ci i{font-style:normal;font-size:13px}
.drops{display:flex;flex-direction:column;gap:10px}
.drop{display:flex;gap:14px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px;flex-wrap:wrap}
.dc{display:flex;gap:10px;align-items:center;width:250px}.nm i{font-style:normal}
</style>
<div id="main">
<h1>Герои и вещи — эскиз v64 (Воин)</h1>
<p>Новое тело для всех людей мира и снаряжение Воина моделями, как в WoW. Каждая вещь — один рисунок: он же значок в сумке, он же на герое в окне, на экране выбора и в мире. Всё ниже движется так же, как будет в игре (готовыми кадрами).</p>
</div>
