  // tools/proto/v86/gal.js
  function soft2(g, w, h, ox, oy, draw2, q = 2) {
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(w * q);
    cv.height = Math.ceil(h * q);
    const c = cv.getContext("2d");
    c.setTransform(q, 0, 0, q, ox * q, oy * q);
    c.lineJoin = c.lineCap = "round";
    setInk(INK);
    try {
      draw2(c);
    } finally {
      setInk(INK_HARD);
    }
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = "source-atop";
    const lg = c.createLinearGradient(cv.width * 0.3, cv.height * 0.25, cv.width * 0.7, cv.height * 0.85);
    lg.addColorStop(0, "rgba(255,236,200,.10)");
    lg.addColorStop(0.5, "rgba(0,0,0,0)");
    lg.addColorStop(1, "rgba(10,6,20,.16)");
    c.fillStyle = lg;
    c.fillRect(0, 0, cv.width, cv.height);
    c.restore();
    const dk = document.createElement("canvas");
    dk.width = cv.width;
    dk.height = cv.height;
    const d2 = dk.getContext("2d");
    d2.drawImage(cv, 0, 0);
    d2.globalCompositeOperation = "source-atop";
    d2.fillStyle = "rgba(16,8,2,.62)";
    d2.fillRect(0, 0, dk.width, dk.height);
    const out = document.createElement("canvas");
    out.width = cv.width;
    out.height = cv.height;
    const o = out.getContext("2d");
    const d = Math.max(1, q * 0.42);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      o.drawImage(dk, Math.cos(a) * d, Math.sin(a) * d);
    }
    o.drawImage(cv, 0, 0);
    g.drawImage(out, -ox, -oy, w, h);
  }
  function gallery(cv, t) {

    const list = [["house", 0], ["house", 1], ["house", 2], ["forge"], ["bank"], ["tavern"], ["enchant"], ["miners"], ["herbal"], ["inn"], ["stall"], ["palace"]];

    const S = 0.6;

        col = 0;
        row++;
      }
    }
