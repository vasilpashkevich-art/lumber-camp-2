</style></head><body>
<section id="s1"><svg id="map" width="1600" height="1000" viewBox="0 0 1600 1000"></svg></section>

<script>
const NS='http://www.w3.org/2000/svg';
function h(svg,s){svg.insertAdjacentHTML('beforeend',s)}
function rnd(seed){let s=seed;return()=>((s=(s*16807)%2147483647)/2147483647)}
// --- волнистый многоугольник
function wob(pts,amp,seed){const r=rnd(seed);let out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const n=6;for(let k=0;k<n;k++){const t=k/n;const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;const j=k===0?0:amp;out.push([x+(r()-.5)*j,y+(r()-.5)*j])}}return out}
const P=a=>a.map(p=>p.join(',')).join(' ');
function cen(a){let x=0,y=0;a.forEach(p=>{x+=p[0];y+=p[1]});return[x/a.length,y/a.length]}

// ================= 1. КАРТА КОНТИНЕНТА =================
const map=document.getElementById('map');
h(map,`<defs><pattern id="sea" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#2c4a5c"/><path d="M5 20 q5 -4 10 0 t10 0" stroke="#3d6378" fill="none" stroke-width="2"/></pattern>
<filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".5"/></filter></defs>
<rect width="1600" height="1000" fill="url(#sea)"/>`);
const Z=[
 {n:'Сосновый дол',l:'1–6',c:'#6f9a4c',p:[[650,400],[800,360],[950,410],[990,540],[900,650],[720,660],[620,560]],m:'волки · кабаны · молодые разбойники',lp:[800,470]},
 {n:'Хуторские угодья',l:'6–10',c:'#b9a65a',p:[[620,560],[720,660],[900,650],[990,540],[1060,640],[980,820],[760,860],[560,790],[520,640]],m:'разбойники · дикие псы · пугала',lp:[780,760]},
 {n:'Грибной лес',l:'10–14',c:'#8b6aa8',p:[[950,410],[990,540],[1060,640],[1220,620],[1320,480],[1200,330],[1040,330]],m:'споровики · пауки · слизни',lp:[1140,470]},
 {n:'Болотный край',l:'14–18',c:'#4f7a62',p:[[1060,640],[980,820],[1120,900],[1320,840],[1400,700],[1320,480],[1220,620]],m:'змеи · утопленники · ведьмы',lp:[1200,740]},
 {n:'Скалистое нагорье',l:'18–23',c:'#8a8578',p:[[650,400],[800,360],[950,410],[1040,330],[1000,180],[780,140],[600,200],[560,330]],m:'големы · гарпии · тролли',lp:[800,250]},
 {n:'Красная пустошь',l:'23–27',c:'#b2573a',p:[[620,560],[650,400],[560,330],[360,420],[200,500],[220,700],[400,840],[560,790],[520,640]],m:'огненные элементали · саламандры',lp:[420,610]},
 {n:'Снежный край',l:'27–30',c:'#c9d8e4',p:[[360,420],[560,330],[600,200],[780,140],[700,70],[420,90],[260,220],[230,380]],m:'ледяные великаны · йети',lp:[470,240],dark:1},
];
Z.forEach((z,i)=>{const w=wob(z.p,18,i*97+5);h(map,`<polygon points="${P(w)}" fill="${z.c}" stroke="#f3e7c9" stroke-width="3" stroke-linejoin="round" filter="url(#sh)"/>`)});
// горные хребты: с высоких зон в стартовую прохода нет
const ridge=(pts)=>{let s='';for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];for(let t=0;t<1;t+=.12){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;s+=`<path d="M${x-9},${y+7} L${x},${y-9} L${x+9},${y+7}Z" fill="#5c5247" stroke="#2b241d" stroke-width="1.5"/>`}}return s};
h(map,ridge([[620,560],[650,400],[800,360],[950,410]]));
Z.forEach(z=>{const[x,y]=z.lp;const col=z.dark?'#1d2733':'#fff8e6';h(map,`<text x="${x}" y="${y}" text-anchor="middle" font-size="26" font-weight="bold" fill="${col}" stroke="${z.dark?'#fff':'#2a2116'}" stroke-width="${z.dark?0:4}" paint-order="stroke">${z.n}</text>
<text x="${x}" y="${y+30}" text-anchor="middle" font-size="22" fill="${col}" stroke="${z.dark?'#fff':'#2a2116'}" stroke-width="${z.dark?0:4}" paint-order="stroke">ур. ${z.l}</text>
<text x="${x}" y="${y+54}" text-anchor="middle" font-size="15" font-style="italic" fill="${col}" stroke="${z.dark?'#fff':'#2a2116'}" stroke-width="${z.dark?0:3}" paint-order="stroke">${z.m}</text>`)});
// столица
h(map,`<g transform="translate(800,560)" filter="url(#sh)"><circle r="34" fill="#d9c79a" stroke="#4a3a24" stroke-width="4"/>
<path d="M-18,10 v-18 h6 v-8 h6 v8 h12 v-8 h6 v8 h6 v18z" fill="#6b5536"/><path d="M-4,-24 l4,-10 l4,10z" fill="#a83232"/></g>
<text x="800" y="618" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffe9a8" stroke="#2a2116" stroke-width="4" paint-order="stroke">Столица</text>`);
// дороги
h(map,`<path d="M800,580 C790,650 760,700 770,780" stroke="#e8d7a8" stroke-width="5" fill="none" stroke-dasharray="10 7"/>
<path d="M830,560 C900,560 960,580 1010,600 C1060,560 1110,520 1150,500" stroke="#e8d7a8" stroke-width="5" fill="none" stroke-dasharray="10 7"/>

h(map,`<g transform="translate(1250,40)"><rect width="320" height="200" rx="10" fill="#1d1812" fill-opacity=".85" stroke="#8a7350"/>

<g transform="translate(36,100)"><rect x="-3" y="-12" width="6" height="20" fill="#eee"/><rect x="-8" y="-7" width="16" height="4" fill="#eee"/></g><text x="64" y="106" font-size="17" fill="#e9dfc8">кладбище (возрождение)</text>
<path d="M24,134 h26" stroke="#e8d7a8" stroke-width="5" stroke-dasharray="8 5"/><text x="64" y="140" font-size="17" fill="#e9dfc8">дорога</text>
<path d="M28,176 L37,160 L46,176Z" fill="#5c5247" stroke="#2b241d"/><text x="64" y="174" font-size="17" fill="#e9dfc8">горы: из долины на север и запад</text>

<text x="40" y="970" font-size="18" fill="#e9dfc8" font-style="italic">Эскиз 1 из 3. Уровни идут по кругу от столицы: юг → восток → юго-восток → север → запад → крайний север. Уровни 30–50 — следующие континенты.</text>`);

// ================= 2. СТАРТОВАЯ ЗОНА =================
const zn=document.getElementById('zone');
h(zn,`<defs><filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".5"/></filter>
<radialGradient id="gr"><stop offset="0" stop-color="#7fa95a"/><stop offset="1" stop-color="#5d8a42"/></radialGradient></defs>
<rect width="1600" height="1000" fill="#3f2f22"/><rect x="20" y="20" width="1560" height="960" rx="18" fill="url(#gr)"/>`);
// деревья
{const r=rnd(42);for(let i=0;i<260;i++){const x=40+r()*1520,y=40+r()*920;const dx=x-560,dy=y-470;if(dx*dx+dy*dy<260*260)continue;if(Math.abs(y-(470+(x-560)*0.05))<26&&x>800)continue;if(Math.abs(x-(560+(y-470)*0.02))<26&&y>700)continue;h(zn,`<circle cx="${x}" cy="${y}" r="${10+r()*8}" fill="${r()<.5?'#2f5d2a':'#3b6d31'}" stroke="#1f3d1c" stroke-width="1.5"/>`)}}
// горы сверху и слева
h(zn,ridge([[30,60],[400,40],[800,50],[1200,40],[1580,60]]).replaceAll('#5c5247','#6f6455'));
h(zn,ridge([[30,80],[40,400],[30,700],[40,960]]).replaceAll('#5c5247','#6f6455'));
// дороги
h(zn,`<path d="M560,470 L1600,520" stroke="#cdb886" stroke-width="22" fill="none" stroke-linecap="round"/>
<path d="M560,470 L575,1000" stroke="#cdb886" stroke-width="22" fill="none" stroke-linecap="round"/>
<text x="1560" y="500" text-anchor="end" font-size="20" fill="#fff8e6" stroke="#2a2116" stroke-width="4" paint-order="stroke">→ Грибной лес (10–14)</text>
<text x="600" y="970" font-size="20" fill="#fff8e6" stroke="#2a2116" stroke-width="4" paint-order="stroke">↓ Хуторские угодья (6–10)</text>`);
// столица
h(zn,`<circle cx="560" cy="470" r="230" fill="#b9a479" stroke="#6b5a3e" stroke-width="14"/>
<circle cx="560" cy="470" r="230" fill="none" stroke="#8e8577" stroke-width="8" stroke-dasharray="18 10"/>
<circle cx="560" cy="470" r="70" fill="#cbbd9a" stroke="#9b8a66" stroke-width="3"/>`);
const B=[['Ратуша','задания, сюжет',560,470,'#7a5b3a'],['Рынок','продать и купить',430,380,'#b5653a'],['Кузница','ремонт, ковка',700,380,'#5a5a5a'],['Гильдия рудокопов','горное дело',420,560,'#8a6d3b'],['Мастерская чар','зачарование',700,560,'#6b4c8a'],['Таверна','отдых, слухи',560,330,'#8a5a2a'],['Ворота','',790,480,'#6b5a3e']];
B.forEach(([n,d,x,y,c])=>{if(n==='Ворота'){h(zn,`<rect x="${x-10}" y="${y-30}" width="22" height="60" fill="#5a4630" stroke="#2a2116" stroke-width="2"/>`);return}
h(zn,`<g filter="url(#sh2)"><rect x="${x-42}" y="${y-26}" width="84" height="52" rx="6" fill="${c}" stroke="#2a2116" stroke-width="2.5"/><path d="M${x-48},${y-24} L${x},${y-52} L${x+48},${y-24}Z" fill="#7d3a2a" stroke="#2a2116" stroke-width="2.5"/></g>
<text x="${x}" y="${y+6}" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff8e6">${n}</text>${d?`<text x="${x}" y="${y+44}" text-anchor="middle" font-size="13" font-style="italic" fill="#2a2116">${d}</text>`:''}`)});
const quest=(x,y,s='!')=>h(zn,`<g transform="translate(${x},${y})"><circle r="15" fill="#2a2116" stroke="#ffd44a" stroke-width="2.5"/><text y="7" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffd44a">${s}</text></g>`);
quest(605,430);quest(470,330);
h(zn,`<text x="560" y="730" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffe9a8" stroke="#2a2116" stroke-width="5" paint-order="stroke">СТОЛИЦА</text>`);
// кладбище
h(zn,`<g transform="translate(330,800)"><rect x="-55" y="-35" width="110" height="70" rx="8" fill="#6e7a5e" stroke="#3c4434" stroke-width="2"/>${[-30,0,30].map(dx=>`<g transform="translate(${dx},0)"><rect x="-3" y="-14" width="6" height="22" fill="#e6e6e6"/><rect x="-9" y="-8" width="18" height="5" fill="#e6e6e6"/></g>`).join('')}</g>
<text x="330" y="860" text-anchor="middle" font-size="16" fill="#fff8e6" stroke="#2a2116" stroke-width="4" paint-order="stroke">Кладбище — тут возрождаешься</text>`);
// лагеря мобов
const lvl=(a)=>a<=2?'#9be27a':a<=4?'#f5e05a':'#f59a4a';
const C=[['Волки','1–2',980,300,5],['Волки','2–3',1150,220,6],['Кабаны','2–3',1000,700,5],['Кабаны','3–4',1250,760,6],['Молодые разбойники','4–5',1350,330,7],['Атаман разбойников ★','6',1450,180,1],['Лесные пауки','3–4',260,300,5],['Волки','1–2',820,830,4]];
C.forEach(([n,l,x,y,k],i)=>{const r=rnd(i*31+7);const lo=parseInt(l);h(zn,`<circle cx="${x}" cy="${y}" r="${k>1?70:46}" fill="#000" fill-opacity=".14" stroke="${lvl(lo)}" stroke-width="3" stroke-dasharray="8 6"/>`);for(let j=0;j<k;j++){const a=r()*6.28,d=r()*48;h(zn,`<circle cx="${x+Math.cos(a)*d}" cy="${y+Math.sin(a)*d}" r="${k>1?9:16}" fill="#a3342c" stroke="#2a0e0b" stroke-width="2"/>`)}
h(zn,`<text x="${x}" y="${y+(k>1?92:68)}" text-anchor="middle" font-size="17" font-weight="bold" fill="${lvl(lo)}" stroke="#1a1410" stroke-width="4" paint-order="stroke">${n} · ур. ${l}</text>`)});
// жилы
[[880,140,'медь'],[1100,880,'медь'],[180,600,'олово'],[1480,640,'медь']].forEach(([x,y,n])=>h(zn,`<g transform="translate(${x},${y})" filter="url(#sh2)"><path d="M-18,10 L-12,-10 L4,-16 L18,-4 L14,12Z" fill="#7d7468" stroke="#2a2116" stroke-width="2"/><circle cx="-4" cy="-2" r="4" fill="#d47a3a"/><circle cx="7" cy="3" r="3" fill="#d47a3a"/></g><text x="${x}" y="${y+34}" text-anchor="middle" font-size="15" fill="#fff8e6" stroke="#2a2116" stroke-width="3" paint-order="stroke">жила: ${n}</text>`));
// квестодатели в поле
quest(1180,560);h(zn,`<text x="1180" y="595" text-anchor="middle" font-size="15" fill="#fff8e6" stroke="#2a2116" stroke-width="3" paint-order="stroke">Лесник</text>`);
quest(260,420);h(zn,`<text x="260" y="455" text-anchor="middle" font-size="15" fill="#fff8e6" stroke="#2a2116" stroke-width="3" paint-order="stroke">Охотница</text>`);
// легенда
h(zn,`<g transform="translate(1220,850)"><rect width="350" height="118" rx="10" fill="#1d1812" fill-opacity=".85" stroke="#8a7350"/>
<circle cx="28" cy="28" r="9" fill="#a3342c"/><text x="48" y="34" font-size="16" fill="#e9dfc8">лагерь мобов, рамка по уровню:</text>
<text x="48" y="56" font-size="16"><tspan fill="#9be27a">1–2</tspan><tspan fill="#e9dfc8"> · </tspan><tspan fill="#f5e05a">3–4</tspan><tspan fill="#e9dfc8"> · </tspan><tspan fill="#f59a4a">5–6</tspan><tspan fill="#e9dfc8">  ★ — редкий сильный</tspan></text>
<text x="48" y="80" font-size="16" fill="#e9dfc8">возрождение лагеря: 6 мин, ★ — 20 мин</text>
<g transform="translate(28,100)"><circle r="10" fill="#2a2116" stroke="#ffd44a" stroke-width="2"/><text y="5" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffd44a">!</text></g><text x="48" y="106" font-size="16" fill="#e9dfc8">задание</text></g>
<text x="40" y="1000" font-size="1">.</text>
<rect x="30" y="30" width="660" height="36" rx="6" fill="#1d1812" fill-opacity=".8"/>
<text x="44" y="56" font-size="20" fill="#ffe9a8">Эскиз 2 из 3. Сосновый дол (ур. 1–6) и Столица — то, что будет в v53</text>`);

// ================= 3. ЭКРАН ВЫБОРА ГЕРОЯ =================
const sel=document.getElementById('sel');
h(sel,`<defs><radialGradient id="bg3" cx=".5" cy=".55" r=".7"><stop offset="0" stop-color="#3a3024"/><stop offset="1" stop-color="#0e0b08"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d77a"/><stop offset="1" stop-color="#a87a2a"/></linearGradient></defs>

<ellipse cx="800" cy="690" rx="220" ry="44" fill="#000" fill-opacity=".5"/><ellipse cx="800" cy="690" rx="170" ry="30" fill="none" stroke="#e7c35a" stroke-opacity=".5" stroke-width="2"/>`);
// герой (простая фигура в стиле игры)
h(sel,`<g transform="translate(800,470) scale(3.2)">
<rect x="-14" y="44" width="10" height="26" rx="3" fill="#4a3a2a"/><rect x="4" y="44" width="10" height="26" rx="3" fill="#4a3a2a"/>

<circle cx="0" cy="-16" r="16" fill="#e8c09a" stroke="#2a1410" stroke-width="2"/><path d="M-17,-20 a17,17 0 0 1 34,0 v-4 h-34z" fill="#8a8f96" stroke="#2a1410" stroke-width="2"/>
<rect x="22" y="-30" width="5" height="80" fill="#6b4a2a" stroke="#2a1410" stroke-width="1.5"/><path d="M14,-34 h22 v14 h-22z" fill="#9aa0a8" stroke="#2a1410" stroke-width="2"/></g>`);
// слоты
const S=[['Торвальд','Воин',14,'Болотный край','12 ч 40 мин',1],['Мирна','Маг',7,'Хуторские угодья','3 ч 05 мин',0],['Ясь','Лучник',3,'Сосновый дол','40 мин',0],null,null];

const[n,c,l,z,t,on]=s;h(sel,`<rect x="1180" y="${y}" width="340" height="88" rx="8" fill="${on?'#3a2d18':'#1e1810'}" stroke="${on?'#f5d77a':'#6b5a3e'}" stroke-width="${on?3:1.5}"/>
<circle cx="1222" cy="${y+44}" r="28" fill="${CC[c]}" stroke="#1a1410" stroke-width="2"/><text x="1222" y="${y+52}" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">${l}</text>
<text x="1266" y="${y+34}" font-size="22" font-weight="bold" fill="#ffe9a8">${n}</text>
